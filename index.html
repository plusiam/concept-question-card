<!-- concept-question-card V1 — 탐구 주제 중심 개념 질문 분류 보드 (5-6학년) -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개념 질문 카드 — IB PYP 탐구 질문 만들기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-wrapper">

  <!-- 상단 헤더 -->
  <header class="app-header">
    <div class="header-meta">
      <div class="header-topic-row">
        <span class="header-topic-prefix">🔍</span>
        <div
          class="header-topic"
          id="headerTopic"
          contenteditable="true"
          spellcheck="false"
          data-placeholder="오늘의 주제를 입력하세요 (예: 놀이터)"
        ></div>
      </div>
      <div
        class="header-context"
        id="headerContext"
        contenteditable="true"
        spellcheck="false"
        data-placeholder="수업 맥락 메모 (선택)"
      ></div>
    </div>
    <div class="header-actions">
      <span class="autosave-badge" id="autosaveBadge">💾 자동저장</span>
      <button class="btn-settings" id="btnImport">📥 불러오기</button>
      <button class="btn-settings" id="btnExport">📤 내보내기</button>
      <button class="btn-settings" id="btnPrint">🖨️ 인쇄</button>
      <button class="btn-settings" id="btnSettings">⚙️ 설정</button>
    </div>
    <input type="file" id="fileImport" accept="application/json,.json" hidden>
  </header>

  <!-- 단계 탭 네비게이션 -->
  <nav class="phase-nav" id="phaseNav">
    <button class="phase-tab" data-phase="0">
      🌱 1단계 단어 모으기
      <span class="phase-badge" id="badge0"></span>
    </button>
    <button class="phase-tab active" data-phase="1">
      ✏️ 2단계 질문과 분류
      <span class="phase-badge" id="badge1"></span>
    </button>
    <button class="phase-tab" data-phase="2">
      🎯 3단계 탐구 목록
      <span class="phase-badge" id="badge2"></span>
    </button>
  </nav>

  <!-- 메인 콘텐츠 -->
  <main class="app-main">

    <!-- 인쇄 전용 머리말 (화면에서는 숨김) -->
    <div class="print-header" id="printHeader"></div>

    <!-- 1단계: 단어 모으기 -->
    <section class="phase-panel" id="panel0">
      <!-- JS renderPhase0()로 렌더링 -->
    </section>

    <!-- 2단계: 질문 만들기 + 개념 분류 통합 보드 -->
    <section class="phase-panel active" id="panel1">
      <!-- JS renderPhase1()로 렌더링 -->
    </section>

    <!-- 3단계: 탐구 목록 -->
    <section class="phase-panel" id="panel2">
      <!-- JS renderInquiry()로 렌더링 -->
    </section>

  </main>
</div>

<!-- 개념 컬럼 설정 모달 -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-box modal-box-sm">
    <div>
      <div class="modal-title">⚙️ 설정</div>
      <div class="modal-subtitle">학생·모둠 이름과 표시할 개념을 정해요.</div>
    </div>
    <div class="form-group">
      <label class="form-label" for="inputGroupName">
        학생 / 모둠 이름 <span class="optional">선택</span>
      </label>
      <input
        class="form-input"
        id="inputGroupName"
        type="text"
        placeholder="예: 한지우 / 1모둠"
        maxlength="30"
      >
    </div>
    <div class="form-group">
      <label class="form-label">
        개념 컬럼 <span class="optional">비워두면 7개 전체 표시</span>
      </label>
      <div class="concept-check-grid" id="conceptCheckGrid"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="btnModalCancel">닫기</button>
      <button class="btn btn-primary" id="btnModalSave">저장하기</button>
    </div>
  </div>
</div>

<!-- SortableJS CDN -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.3/Sortable.min.js"></script>
<script src="data.js"></script>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
