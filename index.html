<!-- concept-question-card V1 — 탐구 주제 중심 개념 질문 분류 보드 (5-6학년) -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개념 질문 카드 — IB PYP 탐구 질문 만들기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-wrapper">

  <!-- 상단 헤더 -->
  <header class="app-header">
    <div class="header-meta">
      <div class="header-topic-row">
        <span class="header-topic-prefix">🔍</span>
        <div
          class="header-topic"
          id="headerTopic"
          contenteditable="true"
          spellcheck="false"
          data-placeholder="오늘의 주제를 입력하세요 (예: 놀이터)"
        ></div>
      </div>
      <div class="header-identity-row">
        <span class="header-id-prefix">👥</span>
        <div
          class="header-identity"
          id="headerIdentity"
          contenteditable="true"
          spellcheck="false"
          data-placeholder="학반 · 이름 또는 모둠 (예: 5-3 한지우)"
        ></div>
      </div>
      <div
        class="header-context"
        id="headerContext"
        contenteditable="true"
        spellcheck="false"
        data-placeholder="수업 맥락 메모 (선택)"
      ></div>
    </div>
    <div class="header-actions">
      <span class="autosave-badge" id="autosaveBadge">💾 자동저장</span>
      <button class="btn-settings" id="btnQr">📱 QR 코드</button>
      <button class="btn-settings" id="btnImport">📥 불러오기</button>
      <button class="btn-settings" id="btnExport">📤 내보내기</button>
      <button class="btn-settings" id="btnSettings">⚙️ 설정</button>
      <button class="btn-settings" id="btnReset">🔄 새로 시작</button>
    </div>
    <input type="file" id="fileImport" accept="application/json,.json" hidden>
  </header>

  <!-- 단계 탭 네비게이션 -->
  <nav class="phase-nav" id="phaseNav">
    <button class="phase-tab" data-phase="0">
      🌱 1단계 단어 모으기
      <span class="phase-badge" id="badge0"></span>
    </button>
    <button class="phase-tab active" data-phase="1">
      ✏️ 2단계 질문과 분류
      <span class="phase-badge" id="badge1"></span>
    </button>
    <button class="phase-tab" data-phase="2">
      🎯 3단계 탐구 질문
      <span class="phase-badge" id="badge2"></span>
    </button>
  </nav>

  <!-- 단계별 사용 안내 (접었다 펼 수 있음) -->
  <details class="step-help" id="stepHelp">
    <summary class="step-help-summary">💡 사용 방법</summary>
    <div class="step-help-body" id="stepHelpBody"></div>
  </details>

  <!-- 메인 콘텐츠 -->
  <main class="app-main">

    <!-- 인쇄 전용 머리말 (화면에서는 숨김) -->
    <div class="print-header" id="printHeader"></div>

    <!-- 1단계: 단어 모으기 -->
    <section class="phase-panel" id="panel0">
      <!-- JS renderPhase0()로 렌더링 -->
    </section>

    <!-- 2단계: 질문 만들기 + 개념 분류 통합 보드 -->
    <section class="phase-panel active" id="panel1">
      <!-- JS renderPhase1()로 렌더링 -->
    </section>

    <!-- 3단계: 탐구 질문 -->
    <section class="phase-panel" id="panel2">
      <!-- JS renderInquiry()로 렌더링 -->
    </section>

  </main>
</div>

<!-- 개념 컬럼 설정 모달 -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-box modal-box-sm">
    <div>
      <div class="modal-title">⚙️ 개념 컬럼 설정</div>
      <div class="modal-subtitle">분류 보드에 표시할 개념을 골라요. 비워두면 7개 전체 표시.</div>
    </div>
    <div class="form-group">
      <div class="concept-check-grid" id="conceptCheckGrid"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="btnModalCancel">닫기</button>
      <button class="btn btn-primary" id="btnModalSave">저장하기</button>
    </div>
  </div>
</div>

<!-- 내보내기 모달 -->
<div class="modal-overlay hidden" id="exportModal">
  <div class="modal-box modal-box-sm">
    <div>
      <div class="modal-title">📤 내보내기</div>
      <div class="modal-subtitle">단계별로 인쇄하거나 전체를 파일로 저장해요.</div>
    </div>
    <div class="export-options" id="exportOptions">
      <button class="export-option" data-action="print" data-phase="0">🖨️ 1단계 단어 모으기 인쇄</button>
      <button class="export-option" data-action="print" data-phase="1">🖨️ 2단계 질문과 분류 인쇄</button>
      <button class="export-option" data-action="print" data-phase="2">🖨️ 3단계 탐구 질문 인쇄</button>
      <button class="export-option" data-action="json">📄 전체 JSON 파일로 저장</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="btnExportCancel">닫기</button>
    </div>
  </div>
</div>

<!-- QR 코드 모달 -->
<div class="modal-overlay hidden" id="qrModal">
  <div class="modal-box modal-box-sm">
    <div>
      <div class="modal-title">📱 QR 코드로 접속</div>
      <div class="modal-subtitle">학생이 휴대폰·태블릿 카메라로 QR 코드를 비추면 이 도구에 바로 들어와요.</div>
    </div>
    <div class="qr-image" id="qrImage"></div>
    <div class="qr-url" id="qrUrl"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="btnQrClose">닫기</button>
    </div>
  </div>
</div>

<!-- SortableJS CDN -->
<script
  src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.3/Sortable.min.js"
  integrity="sha384-/jkFGhPVLS9HIUzX09xB5W3coE5q1X5NXZA/PuOAdOaRxUPczlZmKzYEq9QcJnW0"
  crossorigin="anonymous"
  referrerpolicy="no-referrer"></script>
<!-- QR 코드 생성기 CDN -->
<script
  src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"
  integrity="sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k"
  crossorigin="anonymous"
  referrerpolicy="no-referrer"></script>
<script src="data.js"></script>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
